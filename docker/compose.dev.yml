name: renthub-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: renthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: renthub
      POSTGRES_PASSWORD: renthub
      POSTGRES_DB: renthub
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renthub -d renthub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: renthub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
